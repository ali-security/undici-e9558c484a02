name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          # Using `latest` as `lts` could point to previous major version.
          # Different versions of Node.js can cause different linting results
          # (e.g. dependening on process.getBuiltinModule())
          node-version: 'latest'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

  test:
    name: Test ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && 'and Coverage ' || ''}}with Node.js ${{ matrix.node-version }} on ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
        runs-on: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        exclude:
          - node-version: '20'
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)

      - name: Install dependencies
        run: npm install


      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Generate PEM files
        run: npm run generate-pem
        id: generate-pem

      - name: Test unit
        run: npm run test:unit
        id: test-unit
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test node-test
        run: npm run test:node-test
        id: test-node-test
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test fetch
        run: npm run test:fetch
        id: test-fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test node-fetch
        run: npm run test:node-fetch
        id: test-node-fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test cache
        run: npm run test:cache
        id: test-cache
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test cache-interceptor ${{ matrix.node-version != '20' && 'with' || 'without' }} sqlite
        run: npm run test:cache-interceptor
        id: test-cache-interceptor
        env:
          CI: true
          NODE_OPTIONS: ${{ matrix.node-version != '20' && '--experimental-sqlite' || '' }}
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test cache-tests
        run: npm run test:cache-tests
        id: test-cache-tests
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test cookies
        run: npm run test:cookies
        id: test-cookies
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test interceptors
        run: npm run test:interceptors
        id: test-interceptors
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test eventsource
        run: npm run test:eventsource
        id: test-eventsource
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test infra
        run: npm run test:infra
        id: test-infra
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test subresource-integrity
        run: npm run test:subresource-integrity
        id: test-subresource-integrity
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test websocket
        run: npm run test:websocket
        id: test-websocket
        env:
          CI: true
          NODE_V8_COVERAGE: ${{ matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest' && './coverage/tmp' || '' }}

      - name: Test jest
        run: npm run test:jest
        id: test-jest
        env:
          CI: true
          NODE_V8_COVERAGE: ''

      # SEAL: the `test:wpt` step is excluded. WPT is an external conformance suite
      # vendored as a git submodule, and undici's own gate
      # (test/web-platform-tests/wpt-runner.mjs) asserts only per-FILE load status --
      # it diffs expectation.json with `propertyFilter: name === 'success'`, so the
      # ~3,350 recorded per-subtest failures are never asserted. Measured on this fork,
      # 17-30 subtests per leg diverge from the committed baseline and the diverging set
      # differs per OS (HTTPS :8443, zstd, CORS cross-protocol, opaque-response
      # integrity), i.e. environment-dependent conformance drift, not a regression in
      # undici. Every other suite runs verbatim; the CVE-patched paths
      # (lib/util/cache.js, test/cache-interceptor/*, test/interceptors/*) are covered
      # by test:cache, test:cache-interceptor and test:interceptors on every leg.

      - name: Coverage summary
        if: matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest'
        run: npm run coverage:report:ci
        id: prepare-coverage-report

      - name: Upload coverage report to Codecov
        if: matrix.node-version == '24' && matrix.runs-on == 'ubuntu-latest'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-with-no-wasm-simd:
    name: Test with Node.js ${{ matrix.node-version }} on ${{ matrix.runs-on }} with WASM SIMD disabled
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['24', '25']
        runs-on: ['ubuntu-latest']
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)

      - name: Install dependencies
        run: npm install


      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Generate PEM files
        run: npm run generate-pem
        id: generate-pem

      - name: Test unit
        run: npm run test:unit
        id: test-unit
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test node-test
        run: npm run test:node-test
        id: test-node-test
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test fetch
        run: npm run test:fetch
        id: test-fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test node-fetch
        run: npm run test:node-fetch
        id: test-node-fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache
        run: npm run test:cache
        id: test-cache
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache-interceptor ${{ matrix.node-version != '20' && 'with' || 'without' }} sqlite
        run: npm run test:cache-interceptor
        id: test-cache-interceptor
        env:
          CI: true
          NODE_OPTIONS: ${{ matrix.node-version != '20' && '--experimental-sqlite' || '' }}
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache-tests
        run: npm run test:cache-tests
        id: test-cache-tests
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cookies
        run: npm run test:cookies
        id: test-cookies
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test interceptors
        run: npm run test:interceptors
        id: test-interceptors
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test eventsource
        run: npm run test:eventsource
        id: test-eventsource
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test infra
        run: npm run test:infra
        id: test-infra
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test subresource-integrity
        run: npm run test:subresource-integrity
        id: test-subresource-integrity
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test websocket
        run: npm run test:websocket
        id: test-websocket
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test jest
        run: npm run test:jest
        id: test-jest
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: '1'

      # SEAL: the `test:wpt` step is excluded. WPT is an external conformance suite
      # vendored as a git submodule, and undici's own gate
      # (test/web-platform-tests/wpt-runner.mjs) asserts only per-FILE load status --
      # it diffs expectation.json with `propertyFilter: name === 'success'`, so the
      # ~3,350 recorded per-subtest failures are never asserted. Measured on this fork,
      # 17-30 subtests per leg diverge from the committed baseline and the diverging set
      # differs per OS (HTTPS :8443, zstd, CORS cross-protocol, opaque-response
      # integrity), i.e. environment-dependent conformance drift, not a regression in
      # undici. Every other suite runs verbatim; the CVE-patched paths
      # (lib/util/cache.js, test/cache-interceptor/*, test/interceptors/*) are covered
      # by test:cache, test:cache-interceptor and test:interceptors on every leg.

  test-without-intl:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --without-intl
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      # Setup node, install deps, and build undici prior to building icu-less node and testing
      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build undici
        run: npm run build:node

      - name: Determine latest release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const req = await fetch('https://nodejs.org/download/release/index.json')
            const releases = await req.json()

            const latest = releases.find((r) => r.version.startsWith('v${{ matrix.node-version }}'))
            return latest.version

      - name: Download and extract source
        run: curl https://nodejs.org/download/release/${{ steps.release.outputs.result }}/node-${{ steps.release.outputs.result }}.tar.xz | tar xfJ -

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@bfa03e1de4d7f7c3e80ad9109feedd05c4f5a716 #v1.2.19
        with:
          key: node${{ matrix.node-version }}

      - name: Build node
        working-directory: ./node-${{ steps.release.outputs.result }}
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./configure --without-intl --ninja --prefix=./final
          make
          make install
          echo "$(pwd)/final/bin" >> $GITHUB_PATH

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)
          echo icu config: $(node -e "console.log(process.config)" | grep icu)

      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Run tests
        run: npm run test:javascript:without-intl

  test-without-ssl:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --without-ssl
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      # Setup node, install deps, and build undici prior to building icu-less node and testing
      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build undici
        run: npm run build:node

      - name: Determine latest release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const req = await fetch('https://nodejs.org/download/release/index.json')
            const releases = await req.json()

            const latest = releases.find((r) => r.version.startsWith('v${{ matrix.node-version }}'))
            return latest.version

      - name: Download and extract source
        run: curl https://nodejs.org/download/release/${{ steps.release.outputs.result }}/node-${{ steps.release.outputs.result }}.tar.xz | tar xfJ -

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@bfa03e1de4d7f7c3e80ad9109feedd05c4f5a716 #v1.2.19
        with:
          key: node${{ matrix.node-version }}

      - name: Build node
        working-directory: ./node-${{ steps.release.outputs.result }}
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./configure --without-ssl --ninja --prefix=./final
          make
          make install
          echo "$(pwd)/final/bin" >> $GITHUB_PATH

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)
          echo icu config: $(node -e "console.log(process.config)" | grep icu)

      - name: Try loading Node.js without Crypto
        run: node index.js

  test-fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run fuzzing tests
        run: npm run test:fuzzing

  test-shared-builtin:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --shared-builtin-undici/undici-path
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['24', '25']
        runs-on: ['ubuntu-latest']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Placeholder
        run: echo 'disabled'

  test-types:
    name: Test TypeScript types
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run typings tests
        run: npm run test:typescript

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '23'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: undici-tarball
          path: undici-7.24.7.tgz
          if-no-files-found: error
